<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A2387;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E94057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F27121;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15"/>
  <text x="50%" y="40%" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">Awesome Tax Collection</text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" dominant-baseline="middle">Curated Resources for Revenue Management</text>
  <!-- Dynamic aspect: pulsing circles -->
  <circle cx="10%" cy="50%" r="15" fill="white" opacity="0.5">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="90%" cy="50%" r="15" fill="white" opacity="0.5">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
